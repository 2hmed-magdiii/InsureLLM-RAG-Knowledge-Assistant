[project]
name = "insurellm-rag-knowledge-assistant"
version = "0.1.0"
description = "A local RAG knowledge assistant for Insurellm, powered by Ollama, LangChain, Chroma, and Gradio."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=4.44.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.1.4",
    "langchain-ollama>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.5.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
]

[tool.uv]
package = false
